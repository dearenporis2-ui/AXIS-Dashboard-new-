<style>

.links{position:relative}

main{padding:28px 32px 48px;min-width:0}

.col{--sc:#7f93b5;background:#e3e8f0;border-radius:12px;border-top:3px solid var(--sc);padding:10px;min-height:180px;transition:background .15s,outline-color .15s}
.col[data-stage="1"]{--sc:#5b78a8}.col[data-stage="2"]{--sc:#2f5aa0}.col[data-stage="3"]{--sc:var(--gold)}.col[data-stage="4"]{--sc:#aab3c2}

.lead:hover{transform:translateY(-2px);box-shadow:0 8px 18px #13233f1f;border-color:var(--gold)}
.lead.dragging{opacity:.45;transform:rotate(-1.5deg)}
.meta{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;font-variant-numeric:tabular-nums}
dialog{border:0;border-radius:14px;padding:22px;width:min(480px,94vw);box-shadow:0 24px 70px #0006;color:var(--ink)}
dialog[open]{animation:pop .22s var(--e)}
dialog[open]::backdrop{animation:fade .22s ease-out}
dialog::backdrop{background:#0b1a3388}
dialog label{display:block;margin-top:10px;font-size:12px;color:var(--mut)}
dialog input,dialog select,dialog textarea{display:block;width:100%;margin-top:3px;padding:8px 10px;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;transition:border-color .15s,box-shadow .15s}
dialog input:focus,dialog select:focus,dialog textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px #c9a24b33}
.acts{display:flex;gap:8px;margin-top:20px}
.acts span{flex:1}
.first .grid>.card{animation:rise .55s var(--e) both}
.first .grid>.card:nth-child(2){animation-delay:.08s}.first .grid>.card:nth-child(3){animation-delay:.16s}.first .grid>.card:nth-child(4){animation-delay:.24s}
#splash{position:fixed;inset:0;z-index:100;background:#0f1b2d;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash-waves{position:absolute;inset:0}
.shape-waves{position:relative;width:100%;height:100%;overflow:hidden;pointer-events:none;isolation:isolate}
.shape-waves__canvas{position:absolute;inset:0;display:block;width:100%;height:100%;opacity:0;transition:opacity 600ms cubic-bezier(.22,1,.36,1);pointer-events:none}
.shape-waves[data-ready='true'] .shape-waves__canvas{opacity:1}
#splash[data-wave-ready='true'] .sw{opacity:0}
.sw{position:relative;z-index:2;font:600 min(22vw,160px) Fraunces,Georgia,serif;letter-spacing:.06em;color:#c9a24b;animation:pulseText 1.5s ease-in-out infinite alternate}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #b3412e66}70%,100%{box-shadow:0 0 0 7px #b3412e00}}
@keyframes pulseText{from{opacity:.7;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}.brand{width:100%;padding-bottom:10px}.links{display:flex;flex-wrap:wrap}.ind{display:none}.links a.on{background:#1f3560}nav .sp,nav label{display:none}main{padding:18px}}
@media(prefers-reduced-motion:reduce){*,::before,::backdrop{animation:none!important;transition:none!important}}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// Helper definitions first
const $=s=>document.querySelector(s);
const dlg=()=>$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayS=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diff=s=>Math.round((new Date(s+'T00:00')-new Date(todayS()+'T00:00'))/864e5);
const state=m=>{if(m.done)return['ok','Done'];if(!m.due)return['ok','No date'];const n=diff(m.due);return n<0?['bad','Overdue']:n<=30?['soon','Due soon']:['ok','Active']};
const chip=m=>{const[k,l]=state(m);return`<span class="tag s-${k}">${l}</span>`};
const rel=s=>{if(!s)return'';const n=diff(s);return n===0?'today':n<0?-n+'d ago':'in '+n+'d'};
const cname=id=>(db.clients.find(c=>c.id===id)||{}).name||'—';
const mineF=a=>mine?a.filter(x=>x.assignedTo===me):a;
const lnk=(u,t)=>/^https?:\/\//i.test(u||'')?`<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a> `:'';
const title=(c,d)=>d[F[c][0][0]]||'';

const firebaseConfig = {
  apiKey: "AIzaSyCLwX25jpMaQeMv39cz3OMFFGRDIJmlzMc",
  authDomain: "axis-ops-693d3.firebaseapp.com",
  projectId: "axis-ops-693d3",
  storageBucket: "axis-ops-693d3.firebasestorage.app",
  messagingSenderId: "229428857501",
  appId: "1:229428857501:web:dabcc9ff9c85d3972c6274",
  measurementId: "G-NQNHR0H90N"
};

const app = initializeApp(firebaseConfig);
const firestore = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

// The first admin is the bootstrap owner. Other accounts and roles are managed in the Team panel.
const ADMIN_EMAILS = ["dearenporis2@gmail.com"];

const WORKER_BASE_URL = "https://axis-ops-agent.axis-ops.workers.dev";
const TRIGGER_SECRET = "axis_sec_99281";

const STAGES=['Inquiry / Scope','Proposal / Quoted','Active Build','Completed / Handed Over','Archived'];
let USERS=['Dearen','Associate'];
const HOSTS=['Netlify','Firebase','Vercel','Supabase','Cloudflare','GitHub Pages'];
const MT=['Domain (Namecheap)','SSL certificate','Hosting / database health','Uptime (UptimeRobot)','Backup'];
const PS=['Planning','In progress','Live','Done'];
const F={
  leads:[['name','Lead / project name'],['company','Company'],['contact','Email or phone'],['stack','Tech stack needed'],['budget','Budget (SCR)','number'],['stage','Stage',STAGES],['assignedTo','Assigned to',USERS],['scope','Scope notes','text']],
  clients:[['name','Client name'],['contact','Email or phone'],['notes','Notes','text']],
  projects:[['name','Project name'],['clientId','Client','client'],['stack','Tech stack'],['host','Hosting',HOSTS],['url','Live URL'],['repo','GitHub repo URL'],['due','Milestone deadline','date'],['status','Status',PS],['assignedTo','Assigned to',USERS]],
  maint:[['title','Task'],['clientId','Client','client'],['type','Type',MT],['due','Due date','date'],['every','Repeats every (days)','number'],['assignedTo','Assigned to',USERS],['notes','Notes','text']]
};
const NOUN={leads:'lead',clients:'client',projects:'project',maint:'maintenance task'};
const DEF={leads:{stage:STAGES[0]},projects:{status:'Planning'},maint:{type:MT[0]}};
const EMPTY=()=>({leads:[],clients:[],projects:[],maint:[],activity:[]});
let db=EMPTY(),me='',userEmail='',userRole='',team=[],mine=false,actN=30,cur=null;

/* Authentication State Watcher */
onAuthStateChanged(auth, async (user) => {
  const gate = $('#auth-gate');
  const errorEl = $('#login-error');

  if (user) {
    try {
      userEmail = (user.email || '').toLowerCase();
      let profileSnap = await getDoc(doc(firestore, 'team', userEmail));
      if (!profileSnap.exists() && ADMIN_EMAILS.includes(userEmail)) {
        await setDoc(doc(firestore, 'team', userEmail), {email:userEmail,role:'admin',username:'Dearen',createdAt:Date.now()});
        profileSnap = await getDoc(doc(firestore, 'team', userEmail));
      }
      if (!profileSnap.exists() || !['admin','staff'].includes(profileSnap.data().role)) {
        await signOut(auth);
        errorEl.textContent = 'This Google account has not been approved by your AXIS admin yet.';
        errorEl.style.display = 'block';
        gate.style.display = 'flex';
        return;
      }
      const profile = profileSnap.data();
      userRole = ADMIN_EMAILS.includes(userEmail) ? 'admin' : profile.role;
      me = (profile.username || '').trim();
      document.body.dataset.role = userRole;
      gate.style.display = 'none';
      if (!me) return chooseUsername();
      await initApp();
    } catch (err) {
      console.error('Access check failed:', err);
      errorEl.textContent = 'Could not verify your team access. Check your connection and try again.';
      errorEl.style.display = 'block';
      gate.style.display = 'flex';
    }
  } else {
    gate.style.display = "flex";
  }
});

$('#google-login-btn').onclick = async () => {
  const errorEl = $('#login-error');
  errorEl.style.display = "none";
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    console.error("Login Error:", err);
    errorEl.textContent = "Sign-in cancelled or failed. Check authorized domains in Firebase.";
    errorEl.style.display = "block";
  }
};

window.logoutAxis = async () => {
  await signOut(auth);
  window.location.reload();
};

/* Firestore Cloud Adapter */
const FirestoreStore={
 async load(){
  const result = EMPTY();
  for(const col of ['leads','clients','projects','maint','activity']){
    const snapshot = await getDocs(collection(firestore, col));
    snapshot.forEach(docSnap => {
      result[col].push({ id: docSnap.id, ...docSnap.data() });
    });
  }
  result.activity.sort((a,b)=>(b.at||0)-(a.at||0));
  return result;
 },
 async put(c,d){
  await setDoc(doc(firestore, c, String(d.id)), d);
 },
 async del(c,id){
  await deleteDoc(doc(firestore, c, String(id)));
 }
};
const store=FirestoreStore;

async function refreshTeam(){
  const snap = await getDocs(collection(firestore,'team'));
  team = snap.docs.map(d=>({email:d.id,...d.data()})).filter(x=>['admin','staff'].includes(x.role));
  USERS = [...new Set(team.map(x=>x.username).filter(Boolean))];
  if (!USERS.includes(me)) USERS.unshift(me);
  if (!USERS.length) USERS=['Dearen','Associate'];
}
function chooseUsername(){
  const d=dlg();
  d.innerHTML=`<form id="username-form"><h2>Choose your dashboard name</h2><p class="mut">This name appears on assignments and activity. Your role is assigned by the admin.</p><label>Your name<input name="username" maxlength="40" required autocomplete="name"></label><div class="acts"><span></span><button class="btn pri">Continue</button></div></form>`;
  d.showModal();
  $('#username-form').onsubmit=async e=>{
    e.preventDefault();
    const name=new FormData(e.target).get('username').trim();
    if(!name)return;
    try{
      await updateDoc(doc(firestore,'team',userEmail),{username:name,updatedAt:Date.now()});
      me=name;d.close();await initApp();
    }catch(err){console.error(err);alert('Could not save your name. Please try again.');}
  };
}
window.openTeam=async()=>{
  await refreshTeam();
  const d=dlg();
  d.style.maxHeight='85vh';d.style.overflow='auto';
  d.innerHTML=`<form id="team-form"><h2>Team access</h2><p class="mut">Approve a Google account by email and choose its role. The person chooses their own dashboard name at first sign-in.</p><label>Google account email<input name="email" type="email" required placeholder="associate@example.com"></label><label>Role<select name="role"><option value="staff">Staff</option><option value="admin">Admin</option></select></label><div class="acts"><span></span><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Approve account</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Approved accounts</h3><div>${team.map(m=>`<div class="li" style="cursor:default"><span><b>${esc(m.username||'Name not set')}</b><br><small class="mut">${esc(m.email)} · ${esc(m.role)}</small></span>${m.email===userEmail?'<span class="tag">You</span>':`<button type="button" class="btn bad sm" data-revoke="${esc(m.email)}">Remove</button>`}</div>`).join('')||'<p class="mut">No team accounts yet.</p>'}</div>`;
  d.showModal();
  $('#team-form').onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),role=String(f.get('role'));
    if(!email||!['staff','admin'].includes(role))return;
    try{await setDoc(doc(firestore,'team',email),{email,role,username:'',createdAt:Date.now()},{merge:true});d.close();await openTeam();}
    catch(err){console.error(err);alert('Could not approve this account. Check your admin access and try again.');}
  };
  d.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{
    if(!confirm(`Remove dashboard access for ${b.dataset.revoke}?`))return;
    try{await deleteDoc(doc(firestore,'team',b.dataset.revoke));d.close();await openTeam();}
    catch(err){console.error(err);alert('Could not remove this account.');}
  });
};

function log(text){const a={id:uid(),at:Date.now(),by:me,text};db.activity.unshift(a);store.put('activity',a)}

async function save(c,d,isNew,msg){
  if(isNew) db[c].push(d);
  await store.put(c,d);
  log(msg);
  render();

  if(isNew){
    try {
      await fetch(`${WORKER_BASE_URL}/trigger`, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "x-axis-secret": TRIGGER_SECRET
        },
        body: JSON.stringify({ collection: c, item: d })
      });
    } catch (err) {
      console.error("Failed to alert AI Ops Associate:", err);
    }
  }
}

  else if(Array.isArray(t)||t==='client'){
   const o=t==='client'?[['','None'],...db.clients.map(x=>[x.id,x.name])]:t.map(x=>[x,x]);
   i2=`<select name="${k}">${o.map(([a,b])=>`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select>`}
  else i2=`<input name="${k}" type="${t||'text'}" value="${esc(v)}"${i===0?' required':''}>`;
  return`<label>${l}${i2}</label>`}).join('');
 const dModal = dlg();
 dModal.innerHTML=`<form id="ff"><h2>${id?'Edit':'New'} ${NOUN[c]}</h2>${fields}<div class="acts">${id?'<button type="button" class="btn bad" data-del>Delete</button>':''}<span></span><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Save ${NOUN[c]}</button></div></form>`;
 if(!dModal.open)dModal.showModal();
 $('#ff').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));dModal.close();
  if(id){Object.assign(d,v);save(c,d,0,`Updated ${NOUN[c]} “${title(c,d)}”`)}
  else{Object.assign(d,v,{id:uid()});save(c,d,1,`Added ${NOUN[c]} “${title(c,d)}”`)}};
};
function remove(){
 const{c,id}=cur,d=db[c].find(x=>x.id===id);
 if(!confirm(`Delete ${NOUN[c]} “${title(c,d)}”?`))return;
 db[c]=db[c].filter(x=>x.id!==id);store.del(c,id);dlg().close();log(`Deleted ${NOUN[c]} “${title(c,d)}”`);render();
}
window.markDone=id=>{
 const m=db.maint.find(x=>x.id===id);
 if(+m.every>0){const base=m.due&&diff(m.due)>0?m.due:todayS();m.due=addDays(base,+m.every);log(`Completed “${m.title}”, next due ${m.due}`)}
 else{m.done=true;log(`Completed “${m.title}”`)}
 store.put('maint',m);render();
};
function seed(){
 const t=todayS(),c={id:uid(),name:'Sample Café',contact:'cafe@example.com'};
 db.clients.push(c);
 db.leads.push({id:uid(),name:'Booking site',company:'Sample Villa',contact:'+248 2 000 000',stack:'HTML, Firebase',budget:12000,stage:STAGES[0],assignedTo:'Dearen',scope:'Booking form and gallery'},{id:uid(),name:'Menu redesign',company:'Sample Café',stage:STAGES[1],budget:6000,assignedTo:'Associate'});
 db.projects.push({id:uid(),name:'Café website',clientId:c.id,stack:'HTML, Firebase',host:'Netlify',url:'https://example.com',due:addDays(t,10),status:'In progress',assignedTo:'Dearen'});
 db.maint.push({id:uid(),title:'Renew samplecafe.sc',clientId:c.id,type:MT[0],due:addDays(t,-2),every:365,assignedTo:'Dearen'},{id:uid(),title:'SSL check',clientId:c.id,type:MT[1],due:addDays(t,12),every:90,assignedTo:'Associate'},{id:uid(),title:'Backup log',clientId:c.id,type:MT[4],due:addDays(t,60),every:30,assignedTo:'Dearen'});
 ['leads','clients','projects','maint'].forEach(k=>db[k].forEach(d=>store.put(k,d)));
 log('Loaded sample data');render();
}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='axis-ops-'+todayS()+'.json';a.click()}

/* Views */
const hdr=(t,c,mi=1)=>`<div class="top"><h1>${t}</h1>${mi?`<label class="chk"><input type="checkbox" id="mine"${mine?' checked':''}> Mine only</label>`:''}${c?`<button class="btn pri" data-new="${c}">New ${NOUN[c]}</button>`:''}</div>`;
const none=(c,t)=>`<div class="card empty">${t}<br><br><button class="btn pri" data-new="${c}">Add ${NOUN[c]}</button></div>`;
const greet=()=>{const h=new Date().getHours();return`Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${esc(me)}<small>${new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}</small>`};
const V={
 dashboard(){
  if(!['leads','clients','projects','maint'].some(k=>db[k].length))return hdr(greet(),0,0)+`<div class="card empty">Nothing tracked yet. Add your first lead or client, or fill the app with sample data to try it out.<br><br><button class="btn pri" data-new="leads">Add a lead</button> <button class="btn" data-seed>Load sample data</button></div>`;
  const M=mineF(db.maint).filter(m=>!m.done&&state(m)[0]!=='ok').sort((a,b)=>a.due.localeCompare(b.due));
  const P=mineF(db.projects).filter(p=>!['Live','Done'].includes(p.status));
  const li=(c,d,r)=>`<div class="li" data-open="${c}:${d.id}"><span>${esc(title(c,d))} <span class="mut">${esc(cname(d.clientId))}</span></span>${r}</div>`;
  return hdr(greet())+`<div class="grid">
  <div class="card"><h3>Needs attention</h3>${M.length?M.slice(0,7).map(m=>li('maint',m,`<span>${chip(m)} <span class="mut">${rel(m.due)}</span></span>`)).join(''):'<p class="mut">Nothing overdue or due within 30 days.</p>'}</div>
  <div class="card"><h3>Active builds</h3>${P.length?P.slice(0,7).map(p=>li('projects',p,`<span class="mut">${p.due?'due '+rel(p.due):p.status}</span>`)).join(''):'<p class="mut">No builds in progress.</p>'}</div>
  <div class="card"><h3>Pipeline</h3>${STAGES.map(s=>{const a=mineF(db.leads).filter(l=>l.stage===s);return`<div class="li" data-go="pipeline"><span>${s}</span><span>${a.length} <span class="mut">SCR ${a.reduce((n,l)=>n+(+l.budget||0),0).toLocaleString()}</span></span></div>`}).join('')}</div>
  <div class="card"><h3>Latest activity</h3>${db.activity.slice(0,6).map(a=>`<div class="li" data-go="activity"><span>${esc(a.text)}</span><span class="mut">${esc(a.by)}</span></div>`).join('')||'<p class="mut">No activity yet.</p>'}</div></div>`},
 pipeline(){
  const L=mineF(db.leads);
  if(!db.leads.length)return hdr('Pipeline','leads')+none('leads','No leads yet. Add an inquiry, then drag it across the stages.');
  return hdr('Pipeline','leads')+`<div class="board">${STAGES.map((s,i)=>{const a=L.filter(l=>l.stage===s);return`<div class="col" data-stage="${i}"><h3>${s}<span>${a.length}</span></h3>${a.map(l=>`<div class="lead" draggable="true" data-drag="${l.id}" data-open="leads:${l.id}"><b>${esc(l.name)}</b><div class="mut">${esc(l.company)}</div><div class="meta"><span>${l.budget?'SCR '+Number(l.budget).toLocaleString():''}</span><span class="tag">Assigned: ${esc(l.assignedTo)}</span></div></div>`).join('')}</div>`}).join('')}</div>`},
 clients(){
  if(!db.clients.length)return hdr('Clients','clients',0)+none('clients','No clients yet. Clients link to projects and maintenance tasks.');
  return hdr('Clients','clients',0)+`<div class="wrap"><table><tr><th>Client<th>Contact<th>Projects<th>Notes</tr>${db.clients.map(c=>`<tr class="row" data-open="clients:${c.id}"><td><b>${esc(c.name)}</b><td>${esc(c.contact)}<td>${db.projects.filter(p=>p.clientId===c.id).length}<td class="mut">${esc(c.notes)}</tr>`).join('')}</table></div>`},
 projects(){
  const P=mineF(db.projects);
  if(!db.projects.length)return hdr('Projects','projects')+none('projects','No projects yet. Track the stack, repo, hosting and deadline for each build.');
  return hdr('Projects','projects')+`<div class="wrap"><table><tr><th>Project<th>Client<th>Stack<th>Hosting<th>Links<th>Deadline<th>Status<th>Assigned to</tr>${P.map(p=>`<tr class="row" data-open="projects:${p.id}"><td><b>${esc(p.name)}</b><td>${esc(cname(p.clientId))}<td>${esc(p.stack)}<td>${esc(p.host)}<td>${lnk(p.url,'live')}${lnk(p.repo,'repo')}<td>${esc(p.due)} ${p.due?chip({due:p.due,done:['Live','Done'].includes(p.status)}):''}<td>${esc(p.status)}<td>${esc(p.assignedTo)}</tr>`).join('')}</table></div>`},
 maintenance(){
  const M=mineF(db.maint).slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.due||'9').localeCompare(b.due||'9'));
  if(!db.maint.length)return hdr('Maintenance','maint')+none('maint','No tasks yet. Add domain renewals, SSL checks, uptime monitors and backups.');
  return hdr('Maintenance','maint')+`<div class="wrap"><table><tr><th>Task<th>Client<th>Type<th>Due<th>Status<th>Assigned to<th></tr>${M.map(m=>`<tr class="row" data-open="maint:${m.id}"><td><b>${esc(m.title)}</b><td>${esc(cname(m.clientId))}<td>${esc(m.type)}<td>${esc(m.due)} <span class="mut">${m.done?'':rel(m.due)}</span><td>${chip(m)}<td>${esc(m.assignedTo)}<td>${m.done?'':`<button class="btn sm" data-done="${m.id}">Mark done</button>`}</tr>`).join('')}</table></div>`},
 activity(){
  const A=db.activity;
  if(!A.length)return hdr('Activity',0,0)+'<div class="card empty">No activity yet. Every change you or your associate make shows up here.</div>';
  return hdr('Activity',0,0)+`<div class="card">${A.slice(0,actN).map(a=>`<div class="li" style="cursor:default"><span>${esc(a.text)}</span><span class="mut">${esc(a.by)} · ${new Date(a.at).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')}${A.length>actN?'<p><button class="btn" data-more>Show more</button></p>':''}</div>`}
};
const NAVL=[['dashboard','Dashboard'],['pipeline','Pipeline'],['clients','Clients'],['projects','Projects'],['maintenance','Maintenance'],['activity','Activity']];
const nav=v=>{const od=db.maint.filter(m=>state(m)[0]==='bad').length;
 return`<nav>
   <div class="brand">AXIS<i>Ops</i></div>
   <div class="links"><i class="ind"></i>${NAVL.map(([k,l])=>`<a href="#/${k}"${k===v?' class="on"':''}>${l}${k==='maintenance'&&od?`<span class="tag s-bad">${od}</span>`:''}</a>`).join('')}</div>
   <span class="sp"></span>
   <label>Signed in as</label>
   <div style="padding:7px 8px;color:#fff">${esc(me)} <span class="tag">${esc(userRole)}</span></div>
   <button class="btn" data-name>Change my name</button>
   ${userRole==='admin'?'<button class="btn" data-team onclick="openTeam()">Manage team access</button>':''}
   <button class="btn" data-search>Search <kbd>Ctrl K</kbd></button>
   <button class="btn" data-export>Export backup</button>
   <button class="btn bad" style="margin-top:8px" onclick="logoutAxis()">Sign Out</button>
 </nav>`};
let lastV=null,prevI=0;
function render(){const r=location.hash.slice(2),v=V[r]?r:'dashboard',ch=v!==lastV,i=NAVL.findIndex(n=>n[0]===v);
 $('#app').innerHTML=nav(v)+`<main${ch?' class="enter"':''}>${V[v]()}</main>`;
 const ind=$('.ind');ind.style.transform=`translateY(${prevI*38}px)`;ind.offsetHeight;ind.style.transform=`translateY(${i*38}px)`;lastV=v;prevI=i}

/* Search (Ctrl+K) */
function openSearch(){const dModal=dlg();dModal.innerHTML='<input id="q" placeholder="Search leads, clients, projects, tasks" autocomplete="off" style="width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:6px"><div id="res"></div>';if(!dModal.open)dModal.showModal();$('#q').focus()}
function hits(q){q=q.toLowerCase();const o=[];for(const k of['leads','clients','projects','maint'])for(const d of db[k])if(Object.values(d).join(' ').toLowerCase().includes(q))o.push([k,d]);return o.slice(0,8)}
function showHits(q){const h=q?hits(q):[];$('#res').innerHTML=q&&!h.length?'<p class="mut">No matches.</p>':h.map(([k,d])=>`<div class="li" data-open="${k}:${d.id}"><span>${esc(title(k,d))}</span><span class="mut">${NOUN[k]}</span></div>`).join('')}

document.addEventListener('click',e=>{
 const t=e.target;
 const dModal = dlg();
 if(t===dModal){dModal.close();return}
 if(t.closest('a'))return;
 const g=s=>t.closest(s);let x;
 if(g('[data-close]'))dModal.close();
 else if(x=g('[data-new]'))openForm(x.dataset.new);
 else if(x=g('[data-done]'))markDone(x.dataset.done);
 else if(g('[data-seed]'))seed();
 else if(g('[data-del]'))remove();
 else if(g('[data-search]'))openSearch();
 else if(g('[data-export]'))exportJSON();
 else if(g('[data-more]')){actN+=30;render()}
 else if(x=g('[data-go]'))location.hash='#/'+x.dataset.go;
 else if(x=g('[data-open]')){const[c,i]=x.dataset.open.split(':');openForm(c,i)}
});

document.addEventListener('change',e=>{
 if(e.target.id==='mine'){mine=e.target.checked;render()}
});
document.addEventListener('click',e=>{if(e.target.closest('[data-name]'))chooseUsername()});
document.addEventListener('input',e=>{if(e.target.id==='q')showHits(e.target.value.trim())});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}
 if(e.key==='Enter'&&e.target.id==='q'){const h=hits(e.target.value.trim())[0];if(h)openForm(h[0],h[1].id)}
});

/* Drag leads between pipeline stages */
let dragId=null;
document.addEventListener('dragstart',e=>{const l=e.target.closest&&e.target.closest('[data-drag]');if(l){dragId=l.dataset.drag;setTimeout(()=>l.classList.add('dragging'),0);e.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c&&dragId){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{
 const c=e.target.closest&&e.target.closest('.col');if(!c||!dragId)return;e.preventDefault();
 const l=db.leads.find(x=>x.id===dragId),s=STAGES[+c.dataset.stage];dragId=null;
 if(l&&l.stage!==s){l.stage=s;store.put('leads',l);log(`Moved lead “${l.name}” to ${s}`)}
 render();
});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
addEventListener('hashchange',render);

async function initApp(){
  await startSplash();
  await refreshTeam();
  db = await store.load();
  render();
  splashAnim();
}

let splashRoot=null,splashStartedAt=0,splashFinishTimer=0,splashStartPromise=null;
async function startSplash(){
  const el=$('#splash'),mount=$('#splash-waves');
  if(!el||!mount||splashRoot)return;
  if(splashStartPromise)return splashStartPromise;
  splashStartPromise=(async()=>{
    try{
      const [{createElement},{createRoot},{default:ShapeWaves}]=await Promise.all([
        import('react'),import('react-dom/client'),import('./ShapeWaves.js')
      ]);
      if(!el.isConnected)return;
      splashStartedAt=performance.now();
      splashRoot=createRoot(mount);
      const observer=new MutationObserver(()=>{
        if(mount.querySelector('.shape-waves[data-ready="true"]')){
          el.dataset.waveReady='true';
          observer.disconnect();
        }
      });
      observer.observe(mount,{subtree:true,attributes:true,attributeFilter:['data-ready']});
      splashRoot.render(createElement(ShapeWaves,{
        text:'AXIS',fontFamily:'Fraunces, Georgia, serif',fontWeight:600,textSize:0.58,
        shapes:'mixed',cellSize:10,dotSize:0.75,color:'#c9a24b',hoverColor:'#ffffff',
        backgroundColor:'#0f1b2d',speed:1,scale:1.5,contrast:1,brightness:0.4,
        flow:1.9,direction:0,fade:0.25,interactive:false,splashRadius:40,
        splashStrength:1.55,glow:0.8,intro:true,introDuration:3.1,paused:false,
        onError:error=>console.warn('AXIS splash WebGPU unavailable; using the static fallback.',error)
      }));
    }catch(error){
      splashStartedAt=performance.now();
      console.warn('AXIS splash could not load ShapeWaves; using the static fallback.',error);
    }
  })();
  return splashStartPromise;
}
function splashAnim(){
  const el=$('#splash');
  if(!el||splashFinishTimer)return;
  const delay=Math.max(0,3600-(performance.now()-splashStartedAt));
  splashFinishTimer=setTimeout(()=>{
    el.classList.add('out');
    setTimeout(()=>{splashRoot?.unmount();splashRoot=null;el.remove()},600);
  },delay);
}
</script>
